[project]
name = "catdetect"
version = "0.1.0"
description = "Распознавание кошек/собак на камерах Dahua с интеграцией в Home Assistant"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlmodel>=0.0.16",
    "httpx>=0.27",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.1",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "pyyaml>=6",
    "numpy",
    "opencv-python-headless>=4.8",
    "psutil>=5.9",
]

[project.optional-dependencies]
ml = ["ultralytics>=8.3"]
dev = ["pytest>=8"]

[project.scripts]
catdetect = "catdetect.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["catdetect*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
