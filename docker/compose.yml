# Запуск из корня репозитория:  docker compose -f docker/compose.yml up -d --build
# Инференс на процессоре через OpenVINO (Windows + Docker Desktop/WSL2, TrueNAS, Linux).
services:
  catdetect:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: catdetect:latest
    container_name: catdetect
    restart: unless-stopped
    ports:
      - "8000:8000"
    shm_size: 2gb  # загрузчикам данных при обучении
    volumes:
      - C:/catdetect-data:/data  # на Linux/TrueNAS замените на свой путь, например /mnt/pool/apps/catdetect
    environment:
      TZ: Europe/Moscow
    env_file:
      - path: C:/catdetect-data/.env  # необязательный файл с переменными CATDETECT_*
        required: false
